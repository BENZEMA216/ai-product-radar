<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日精选 | AI 产品雷达</title><style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#172c29;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:32px 20px 64px}a{color:#14664e;text-decoration:none}header>a{font-size:14px}h1{font-size:32px;margin:22px 0 10px}.sub{color:#53675f;line-height:1.7}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}input,button,.action{font:inherit;padding:10px 14px;border:1px solid #c5d8cd;border-radius:10px;background:white;color:#17583f}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}article{padding:24px;border:1px solid #d7e2da;background:white;border-radius:18px;overflow-wrap:anywhere}h2{font-size:22px;margin:10px 0 16px}.rank{color:#517566;font-size:13px}p{line-height:1.8;margin:12px 0}b{display:block;font-size:13px;color:#53675f;margin-bottom:3px}.tip{font-size:13px;color:#596c61;background:#f3f7f2;padding:12px;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.action.primary{background:#175d45;color:white;border-color:#175d45}footer{margin-top:30px;color:#66756d;font-size:13px}#status{line-height:1.8}#archive{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 24px}#archive a{padding:7px 10px;background:#e8efe9;border-radius:7px}#archive a[aria-current]{background:#175d45;color:white}@media(max-width:620px){main{padding:22px 16px 48px}.grid{grid-template-columns:1fr}h1{font-size:28px}article{padding:20px}nav{gap:8px}input{max-width:160px}}
</style></head><body><main><header><a href="./">← AI 产品雷达 · 全量榜单</a><h1>每日精选</h1><p class="sub">按日保存的 AI 产品发现。日期是精选日期，不等于产品首发日期；实际发布与试用条件见卡片。</p></header><nav aria-label="选择精选日期"><label for="date">查看日期</label><input id="date" type="date"><button id="open">查看</button><button id="share">复制当天链接</button></nav><div id="archive" aria-label="已有精选"></div><h2 id="day"></h2><p id="status" role="status">正在读取精选…</p><div id="cards" class="grid"></div><footer>资料来自产品官网和发布社区，未经实际试用的功能不代表实测结论。所有日期链接固定，不会随新一期发布跳走。</footer></main><script>
const repo='BENZEMA216/ai-product-radar', raw='https://raw.githubusercontent.com/'+repo+'/main/picks/';
const dateInput=document.querySelector('#date'),status=document.querySelector('#status'),cards=document.querySelector('#cards');
const valid=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');
const link=d=>'picks.html?date='+encodeURIComponent(d);
function safeLink(url){try{let u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
function text(tag,value,parent,cls){const el=document.createElement(tag);el.textContent=value||'';if(cls)el.className=cls;parent.append(el);return el}
async function show(d){if(!valid(d))return;dateInput.value=d;document.querySelector('#day').textContent=d+' · 精选';document.title=d+' 每日精选 | AI 产品雷达';cards.replaceChildren();status.hidden=false;status.textContent='正在读取精选…';try{let r=await fetch(raw+d+'.json');if(!r.ok)throw Error('missing');let picks=await r.json();if(!Array.isArray(picks)||!picks.length)throw Error('missing');picks.forEach((p,i)=>{let c=document.createElement('article');text('div','精选 '+String(i+1).padStart(2,'0'),c,'rank');text('h2',p.product,c);for(let [label,key] of [['做什么','did'],['适合谁','who'],['为什么值得看','why']]){let para=document.createElement('p');text('b',label,para);para.append(document.createTextNode(p[key]||''));c.append(para)}if(p.tip)text('p',p.tip,c,'tip');let actions=document.createElement('div');actions.className='actions';for(let [title,url,cls] of [['打开产品 ↗',p.link,'action primary'],['发布 / 证据 ↗',p.phLink,'action']]){let href=safeLink(url);if(href){let a=text('a',title,actions,cls);a.href=href;a.target='_blank';a.rel='noopener noreferrer'}}c.append(actions);cards.append(c)});status.hidden=true}catch(e){status.textContent='这天的精选尚未发布，或暂时无法读取。请选择下方已有日期，稍后重试。'}document.querySelectorAll('#archive a').forEach(a=>{if(a.dataset.date===d)a.setAttribute('aria-current','date');else a.removeAttribute('aria-current')})}
document.querySelector('#open').onclick=()=>{if(valid(dateInput.value)){history.pushState(null,'',link(dateInput.value));show(dateInput.value)}};window.onpopstate=()=>show(new URLSearchParams(location.search).get('date'));document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#share').textContent='已复制'}catch{status.hidden=false;status.textContent='请复制浏览器地址栏链接。'}};
(async()=>{let dates=[];try{let r=await fetch('https://api.github.com/repos/'+repo+'/contents/picks?ref=main');let entries=await r.json();dates=entries.filter(e=>/^\d{4}-\d{2}-\d{2}\.json$/.test(e.name)).map(e=>e.name.slice(0,-5)).sort().reverse()}catch{}let requested=new URLSearchParams(location.search).get('date');for(let d of dates){let a=text('a',d,document.querySelector('#archive'));a.href=link(d);a.dataset.date=d}let d=valid(requested)?requested:dates[0];if(d){if(!valid(requested))history.replaceState(null,'',link(d));show(d)}else{status.textContent='暂无可读取的日期，请在上方选择日期。'}})();
</script></body></html>
